name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Lint & unit tests (fast — no Docker needed)
  # ---------------------------------------------------------------------------
  test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install pytest pytest-cov pyyaml pydantic

      - name: Run unit tests with coverage
        run: |
          python -m pytest tests/ -v \
            --cov=api \
            --cov=scripts \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: coverage-report
          path: coverage.xml

  # ---------------------------------------------------------------------------
  # Job 2: Validate all YAML profiles against the Pydantic schema
  # ---------------------------------------------------------------------------
  validate-profiles:
    name: Validate YAML Profiles
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install schema dependencies
        run: pip install pyyaml pydantic

      - name: Validate all profiles
        run: |
          echo "=== Validating all YAML profiles ==="
          for profile in profiles/example-*.yaml; do
            echo "  → $profile"
            python scripts/profile_schema.py "$profile"
          done
          echo "=== All profiles valid ==="

      - name: Dry-run each profile (print resolved docker command)
        run: |
          for profile in profiles/example-*.yaml; do
            echo ""
            echo "--- Dry-run: $profile ---"
            python scripts/profile_schema.py --json "$profile" | python -c "
          import json, sys
          d = json.load(sys.stdin)
          print(f'  engine : {d[\"engine\"]}')
          print(f'  model  : {d[\"model\"]}')
          print(f'  port   : {d[\"port\"]}')
          print(f'  image  : {d[\"image\"]}')
          "
          done

  # ---------------------------------------------------------------------------
  # Job 3: Build the gateway Docker image (no push on PRs)
  # ---------------------------------------------------------------------------
  build-gateway:
    name: Build Gateway Image
    runs-on: ubuntu-latest
    needs: [test, validate-profiles]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: false
          tags: modeltainer-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 4: Push gateway image to GHCR (only on merge to main)
  # ---------------------------------------------------------------------------
  push-gateway:
    name: Push Gateway Image to GHCR
    runs-on: ubuntu-latest
    needs: build-gateway
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/gateway
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=true

      - name: Build and push gateway image
        uses: docker/build-push-action@v5
        with:
          context: ./api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
