services:
  gateway:
    build: ./api
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      MODELS_CONFIG: /config/models.yaml
      API_KEY: "${API_KEY:-}"
    volumes:
      - ./config/models.yaml:/config/models.yaml:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
