# =============================================================================
# ModelTainer Profile — llama.cpp on CPU Only
# =============================================================================
# llama.cpp with a GGUF-quantised model — ideal for CPU-only machines,
# laptops, and any environment without an NVIDIA GPU.
# No GPU flags are added; the container runs purely on CPU threads.
#
# Launch:  bash scripts/run_profile.sh profiles/example-llamacpp-cpu.yaml
# Dry-run: bash scripts/run_profile.sh --dry-run profiles/example-llamacpp-cpu.yaml
# =============================================================================

engine: llamacpp
hardware: cpu             # ← No GPU flags
model: unsloth/Qwen2.5-0.5B-Instruct-GGUF
model_file: qwen2.5-0.5b-instruct-q4_k_m.gguf  # Required for llamacpp
port: 8002

model_params:
  # Context window size
  max_model_len: 4096
  # Number of CPU threads (tune to your machine's core count)
  n_threads: 8
  # Number of parallel request slots (concurrent users)
  n_parallel: 2

engine_args: []
