# =============================================================================
# ModelTainer Profile — XS tier: LiquidAI LFM2.5-1.2B-Thinking on CPU
# =============================================================================
# Model tier : XS (Extra Small)
# Model      : LiquidAI/LFM2.5-1.2B-Thinking  (GGUF via llama.cpp)
# Hardware   : CPU-only — no GPU required
# Port       : 8000
#
# Download the GGUF first (huggingface-cli or run_profile.sh handles this):
#   huggingface-cli download bartowski/LFM2.5-1.2B-Thinking-GGUF \
#     --include "LFM2.5-1.2B-Thinking-Q4_K_M.gguf" --local-dir ~/.cache/modeltainer_llamacpp
#
# Launch:  bash scripts/run_profile.sh profiles/example-llamacpp-cpu.yaml
# Dry-run: bash scripts/run_profile.sh --dry-run profiles/example-llamacpp-cpu.yaml
# =============================================================================

engine: llamacpp
hardware: cpu             # ← No GPU flags
model: bartowski/LFM2.5-1.2B-Thinking-GGUF
model_file: LFM2.5-1.2B-Thinking-Q4_K_M.gguf
port: 8000                # XS tier port

model_params:
  # Context window (keep modest on CPU to limit memory pressure)
  max_model_len: 8192
  # Number of CPU threads (tune to your machine's core count)
  n_threads: 8
  # Number of parallel request slots
  n_parallel: 2

engine_args: []
