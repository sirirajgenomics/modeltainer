# =============================================================================
# ModelTainer Profile — L tier: OpenAI OSS 120B on NVIDIA DGX Spark (vLLM)
# =============================================================================
# Model tier : L (Large)
# Model      : openai/gpt-oss-120b
# Hardware   : NVIDIA DGX Spark (GB10 Grace Blackwell — ARM aarch64, 128 GB unified memory)
# Port       : 8030
#
# Key DGX Spark differences vs standard GPU:
#   • --enforce-eager is injected automatically (avoids CUDA graph issues on
#     Grace Blackwell in early driver versions)
#   • gpu_memory_utilization can be set higher (unified memory, no separate VRAM)
#   • Use dtype: auto — Blackwell handles bfloat16 natively
#
# Launch:  bash scripts/run_profile.sh profiles/example-vllm-dgx-spark.yaml
# Dry-run: bash scripts/run_profile.sh --dry-run profiles/example-vllm-dgx-spark.yaml
# =============================================================================

engine: vllm
hardware: dgx_spark       # ← Selects DGX Spark image + injects --enforce-eager
model: openai/gpt-oss-120b
port: 8030                # L tier port

model_params:
  max_model_len: 32768
  gpu_memory_utilization: 0.92
  dtype: auto
  tensor_parallel_size: 2  # 120B requires tensor parallelism across both Blackwell dies

engine_args: []
